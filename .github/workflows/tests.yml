name: 后端测试

# CI（持续集成）：每次推送 / 提交 PR 时，云端自动安装依赖并运行全部测试
on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: 后端 pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 准备环境变量（测试全部离线 Mock，不调用真实 API）
        run: cp .env.example .env

      - name: 运行测试
        run: python -m pytest
